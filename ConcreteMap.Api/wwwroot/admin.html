<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css?v=5.1">
</head>
<body>
    <header class="admin-header">
        <h1 id="page-title">🛠️ Панель управления</h1>
        <div style="display:flex; gap:10px;">
             <a href="index.html" target="_blank" class="btn" style="background: #e9ecef; color: #333; text-decoration: none;">🌍 Открыть карту</a>
             <button id="logout-btn" class="btn btn-danger">Выйти</button>
        </div>
    </header>
    
    <div class="admin-container">
        <!-- 1. Импорт (Только Админ) -->
        <div id="card-import" class="upload-card" style="margin-bottom: 30px;">
            <span class="upload-icon">📂</span>
            <h2 style="margin-top: 0;">Импорт данных</h2>
            <p style="color: #666; margin-bottom: 20px;">Загрузите обновленный Excel файл с заводами</p>
            <div style="margin-bottom: 20px;"><input type="file" id="excel-file" accept=".xlsx" class="btn"></div>
            <button id="upload-btn" class="btn btn-primary" style="width: 200px;">Загрузить в базу</button>
            <div id="status-msg" class="status-box"></div>
            <hr>
            <button id="export-btn" class="btn" style="width: 100%; background: #28a745; color: white; margin-top: 10px;">📥 Скачать текущую базу</button>
        </div>

        <!-- 2. Добавить сотрудника (Только Админ) -->
        <div id="card-users" class="upload-card" style="margin-bottom: 30px;">
            <span class="upload-icon">👤</span>
            <h2 style="margin-top: 0;">Добавить сотрудника</h2>
            <p style="color: #666; margin-bottom: 20px;">Создать учетную запись для менеджера</p>
            <div style="max-width: 300px; margin: 0 auto; text-align: left;">
                <div class="form-group">
                    <label style="font-size: 12px; font-weight: bold;">Логин</label>
                    <input type="text" id="new-user-login" placeholder="manager" style="width: 100%;">
                </div>
                <div class="form-group">
                    <label style="font-size: 12px; font-weight: bold;">Пароль</label>
                    <input type="text" id="new-user-pass" placeholder="secret123" style="width: 100%;">
                </div>
                <button id="create-user-btn" class="btn btn-primary" style="width: 100%;">Создать</button>
                <div id="user-msg" class="status-box"></div>
            </div>
            <h3>Список сотрудников</h3>
            <div id="users-list-container"></div>
        </div>

        <!-- 3. Смена пароля (Для всех) -->
        <div id="card-password" class="upload-card">
            <h2 style="margin-top: 0; font-size: 18px;">🔐 Сменить свой пароль</h2>
            <div style="max-width: 300px; margin: 0 auto; text-align: left;">
                <div class="form-group">
                    <label style="font-size: 12px; font-weight: bold;">Текущий пароль</label>
                    <input type="password" id="old-pass" placeholder="***" style="width: 100%;">
                </div>
                <div class="form-group">
                    <label style="font-size: 12px; font-weight: bold;">Новый пароль</label>
                    <input type="password" id="new-pass" placeholder="***" style="width: 100%;">
                </div>
                <button id="change-pass-btn" class="btn btn-primary" style="width: 100%;">Сохранить</button>
                <div id="pass-msg" style="text-align: center; margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>

        <!-- 4. Управление прайсами -->
        <div class="upload-card">
            <span class="upload-icon">📑</span>
            <h2 style="margin-top: 0;">Прайс-листы заводов</h2>
            <p style="color: #666; margin-bottom: 20px;">Загрузите Excel-файл для конкретного завода</p>
           
            <input type="text" id="factory-search" placeholder="🔍 Найти завод..." style="margin-bottom: 15px;">
           
            <div id="factories-list" style="max-height: 400px; overflow-y: auto; text-align: left; border: 1px solid #eee; border-radius: 6px;">
                <!-- Сюда JS будет рендерить список -->
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwt_token');
        const role = localStorage.getItem('user_role');

        if (!token) window.location.href = 'login.html';

        // Логика отображения по ролям
        if (role !== 'Admin') {
            // Скрываем админские блоки
            document.getElementById('card-import').style.display = 'none';
            document.getElementById('card-users').style.display = 'none';
            // Меняем заголовок
            document.getElementById('page-title').textContent = '👤 Личный кабинет';
        }

        // Загрузка списка заводов для управления прайсами
        async function loadFactoriesForAdmin() {
            try {
                const response = await fetch('/api/Factories', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!response.ok) throw new Error('Ошибка загрузки списка заводов');
                const factories = await response.json();
                renderFactoriesList(factories);
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        function renderFactoriesList(factories) {
            const listDiv = document.getElementById('factories-list');
            listDiv.innerHTML = '';
            
            factories.forEach(factory => {
                const factoryDiv = document.createElement('div');
                factoryDiv.style.padding = '10px';
                factoryDiv.style.borderBottom = '1px solid #eee';
                
                const statusText = factory.priceListUrl ? '✅ Файл загружен' : '❌ Нет файла';
                
                factoryDiv.innerHTML = `
                    <b>${factory.name}</b>
                    <span id="status-${factory.id}">${statusText}</span>
                    <br>
                    <input type="file" id="file-${factory.id}" style="display:none" onchange="uploadPrice(${factory.id})">
                    <button class="btn btn-sm btn-primary" onclick="document.getElementById('file-${factory.id}').click()">Загрузить</button>
                    <button class="btn btn-sm btn-danger" onclick="deletePrice(${factory.id})">Удалить</button>
                `;
                
                listDiv.appendChild(factoryDiv);
            });
        }

        async function uploadPrice(factoryId) {
            const fileInput = document.getElementById(`file-${factoryId}`);
            const file = fileInput.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch(`/api/PriceList/${factoryId}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById(`status-${factoryId}`).textContent = '✅ Файл загружен';
                    fileInput.value = '';
                } else {
                    throw new Error('Ошибка загрузки файла');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка загрузки файла');
            }
        }

        async function deletePrice(factoryId) {
            try {
                const response = await fetch(`/api/PriceList/${factoryId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (response.ok) {
                    document.getElementById(`status-${factoryId}`).textContent = '❌ Нет файла';
                } else {
                    throw new Error('Ошибка удаления файла');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка удаления файла');
            }
        }

        // Фильтрация списка заводов
        document.getElementById('factory-search').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const factories = Array.from(document.querySelectorAll('#factories-list > div'));
            factories.forEach(factoryDiv => {
                const name = factoryDiv.querySelector('b').textContent.toLowerCase();
                factoryDiv.style.display = name.includes(searchTerm) ? 'block' : 'none';
            });
        });

        // Загружаем список заводов при загрузке страницы
        loadFactoriesForAdmin();

        // Загружаем список пользователей при загрузке страницы (только для админа)
        if (role === 'Admin') {
            loadUsers();
        }

        // --- Обработчики событий ---

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_role'); // Не забываем чистить роль
            window.location.href = 'login.html';
        });

        // Логика импорта (Сработает только у Админа, даже если юзер раскроет HTML, сервер не пустит)
        document.getElementById('upload-btn').addEventListener('click', async () => {
            const fileInput = document.getElementById('excel-file');
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('upload-btn');
            if (!fileInput.files[0]) { statusMsg.textContent = '⚠️ Выберите файл'; statusMsg.style.color = '#dc3545'; return; }
            btn.disabled = true; btn.textContent = "Загрузка..."; statusMsg.textContent = "⏳ Обработка..."; statusMsg.style.color = "#007bff";
            const formData = new FormData(); formData.append('file', fileInput.files[0]);
            try {
                const response = await fetch('/api/Import/factories', {
                    method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData
                });
                const data = await response.json();
                if (response.ok) { statusMsg.textContent = `✅ Успешно! Импортировано: ${data.count} строк.`; statusMsg.style.color = "#28a745"; fileInput.value = ""; }
                else { throw new Error(data.message || 'Ошибка загрузки'); }
            } catch (error) {
                statusMsg.textContent = `❌ ${error.message}`; statusMsg.style.color = '#dc3545';
                if (error.message.includes("401")) { logout(); }
            } finally { btn.disabled = false; btn.textContent = "Загрузить в базу"; }
        });

        // Логика экспорта
        document.getElementById('export-btn').addEventListener('click', async () => {
            const btn = document.getElementById('export-btn');
            btn.disabled = true;
            btn.textContent = "Скачивание...";

            try {
                const response = await fetch('/api/Export/factories', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "factories_export.xlsx";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert("Ошибка скачивания");
                }
            } catch (e) {
                console.error(e);
                alert("Ошибка сети");
            } finally {
                btn.disabled = false;
                btn.textContent = "📥 Скачать текущую базу";
            }
        });

        // Логика создания юзера
        document.getElementById('create-user-btn').addEventListener('click', async () => {
            const login = document.getElementById('new-user-login').value;
            const pass = document.getElementById('new-user-pass').value;
            const msg = document.getElementById('user-msg');
            const btn = document.getElementById('create-user-btn');
            if (!login || !pass) { msg.textContent = "Заполните поля"; msg.style.color = "red"; return; }
            btn.disabled = true;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: login, password: pass })
                });
                const data = await response.text(); // или json, зависит от контроллера
                if (response.ok) {
                    msg.textContent = `✅ Сотрудник "${login}" создан!`; msg.style.color = "green";
                    document.getElementById('new-user-login').value = ""; document.getElementById('new-user-pass').value = "";
                } else { msg.textContent = `❌ Ошибка: ${data}`; msg.style.color = "red"; }
            } catch (error) { msg.textContent = "Ошибка сети"; msg.style.color = "red"; } 
            finally { btn.disabled = false; }
        });

        // Логика смены пароля
        document.getElementById('change-pass-btn').addEventListener('click', async () => {
            const oldPass = document.getElementById('old-pass').value;
            const newPass = document.getElementById('new-pass').value;
            const msg = document.getElementById('pass-msg');
            const btn = document.getElementById('change-pass-btn');
            if (!oldPass || !newPass) { msg.textContent = "Заполните все поля"; msg.style.color = "red"; return; }
            btn.disabled = true;
            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass })
                });
                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const json = await response.json();
                    data = json.message || JSON.stringify(json);
                } else { data = await response.text(); }

                if (response.ok) {
                    msg.textContent = "✅ Пароль успешно изменен!"; msg.style.color = "green";
                    document.getElementById('old-pass').value = ""; document.getElementById('new-pass').value = "";
                } else { msg.textContent = `❌ ${data}`; msg.style.color = "red"; }
            } catch (error) { msg.textContent = "Ошибка сети"; msg.style.color = "red"; } 
            finally { btn.disabled = false; }
        });

        // Функция загрузки списка пользователей
        async function loadUsers() {
            try {
                const response = await fetch('/api/auth/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!response.ok) throw new Error('Ошибка загрузки списка пользователей');
                const users = await response.json();
                renderUsersList(users);
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        function renderUsersList(users) {
            const container = document.getElementById('users-list-container');
            container.innerHTML = '';

            if (users.length === 0) {
                container.innerHTML = '<p>Нет пользователей</p>';
                return;
            }

            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';
            table.innerHTML = `
                <thead>
                    <tr style="background-color: #f8f9fa;">
                        <th style="border: 1px solid #dee2e6; padding: 8px;">Логин</th>
                        <th style="border: 1px solid #dee2e6; padding: 8px;">Роль</th>
                        <th style="border: 1px solid #dee2e6; padding: 8px;">Действия</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            `;

            const tbody = table.querySelector('tbody');
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="border: 1px solid #dee2e6; padding: 8px;">${user.username}</td>
                    <td style="border: 1px solid #dee2e6; padding: 8px;">${user.role}</td>
                    <td style="border: 1px solid #dee2e6; padding: 8px;">
                        <button class="btn btn-sm btn-warning" onclick="resetUserPassword('${user.username}')">Сбросить пароль</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            container.appendChild(table);
        }

        // Функция сброса пароля пользователя
        async function resetUserPassword(username) {
            const newPassword = prompt(`Введите новый пароль для пользователя ${username}:`, '123456');
            if (!newPassword) return;

            try {
                const response = await fetch('/api/auth/admin-reset-password', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: username, newPassword: newPassword })
                });

                if (response.ok) {
                    alert(`Пароль для пользователя ${username} успешно сброшен!`);
                } else {
                    const error = await response.text();
                    alert(`Ошибка: ${error}`);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка сети');
            }
        }

        function logout() {
            localStorage.removeItem('jwt_token'); localStorage.removeItem('user_role'); window.location.href = 'login.html';
        }
    </script>
</body>
</html>
